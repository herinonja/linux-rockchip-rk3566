name: Build Radxa Zero 3W RK3566 Kernel

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build.yml"

jobs:
  build:
    runs-on: ubuntu-24.04

    env:
      ARCH: arm64
      CROSS_COMPILE: aarch64-linux-gnu-
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 5G
      KERNEL_VERSION: "7.0.3"
      TARGET_DTB: "rk3566-radxa-zero-3w.dtb"

    steps:
      - name: Checkout workflow repo
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            git wget ca-certificates xz-utils patch \
            bc bison flex build-essential \
            libssl-dev libelf-dev libncurses-dev \
            dwarves pahole ccache rsync python3 \
            cpio lz4 zstd kmod \
            crossbuild-essential-arm64 \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-radxa-zero3w-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            ccache-radxa-zero3w-${{ runner.os }}-

      - name: Prepare ccache
        run: |
          ccache --set-config=max_size=5G
          ccache --zero-stats
          mkdir -p ~/.local/bin
          ln -sf /usr/bin/ccache ~/.local/bin/aarch64-linux-gnu-gcc
          ln -sf /usr/bin/ccache ~/.local/bin/aarch64-linux-gnu-g++
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Clone linux-rockchip v7.0.3
        run: |
          git clone --branch v7.0.3 --depth 1 https://github.com/inindev/linux-rockchip.git linux-rockchip

      - name: Download Linux 7.0.3 source
        run: |
          wget https://cdn.kernel.org/pub/linux/kernel/v7.x/linux-7.0.3.tar.xz
          tar -xf linux-7.0.3.tar.xz

      - name: Apply linux-rockchip patches
        run: |
          cd linux-7.0.3
          PATCHES=$(find ../linux-rockchip/patches -type f | sort)

          if [ -z "$PATCHES" ]; then
            echo "No patch files found."
            exit 1
          fi

          for p in $PATCHES; do
            echo "Applying $p"
            patch -p1 < "$p"
          done

      - name: Configure kernel for Radxa Zero 3W RK3566
        run: |
          cd linux-7.0.3

          # Base ARM64 config
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- defconfig

          # Rockchip platform
          scripts/config --enable ARCH_ROCKCHIP
          scripts/config --enable ARM64
          scripts/config --enable OF
          scripts/config --enable OF_OVERLAY

          # DRM / display stack
          scripts/config --enable DRM
          scripts/config --enable DRM_KMS_HELPER
          scripts/config --enable DRM_GEM_SHMEM_HELPER
          scripts/config --enable DRM_SCHED
          scripts/config --enable DRM_ROCKCHIP
          scripts/config --enable ROCKCHIP_DW_HDMI
          scripts/config --enable PHY_ROCKCHIP_INNO_HDMI

          # Mali GPU
          # RK3566 / Mali G52 = Panfrost
          scripts/config --module DRM_PANFROST

          # Optional: Mali CSF/Valhall newer GPUs
          scripts/config --module DRM_PANTHOR

          # Media / VPU helpers for Kodi-related stack
          scripts/config --enable MEDIA_SUPPORT
          scripts/config --module VIDEO_HANTRO
          scripts/config --module VIDEO_ROCKCHIP_VDEC
          scripts/config --module VIDEO_ROCKCHIP_RGA

          # Filesystems usually useful on Armbian/DietPi
          scripts/config --enable EXT4_FS
          scripts/config --enable BTRFS_FS
          scripts/config --enable VFAT_FS
          scripts/config --enable EXFAT_FS

          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- olddefconfig

      - name: Build kernel Image modules dtbs
        run: |
          cd linux-7.0.3

          make -j$(nproc) \
            ARCH=arm64 \
            CROSS_COMPILE="ccache aarch64-linux-gnu-" \
            Image modules dtbs

      - name: Verify Radxa Zero 3W DTB exists
        run: |
          DTB_PATH="linux-7.0.3/arch/arm64/boot/dts/rockchip/${TARGET_DTB}"

          if [ ! -f "$DTB_PATH" ]; then
            echo "Missing DTB: $DTB_PATH"
            echo "Available rk3566 DTBs:"
            find linux-7.0.3/arch/arm64/boot/dts/rockchip -name "rk3566*.dtb" | sort
            exit 1
          fi

          echo "Found target DTB: $DTB_PATH"

      - name: Install modules to staging
        run: |
          cd linux-7.0.3

          make ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            INSTALL_MOD_PATH=${{ github.workspace }}/modules-staging \
            modules_install

      - name: Package Radxa Zero 3W kernel artifact
        run: |
          mkdir -p artifacts/boot/dtb/rockchip
          mkdir -p artifacts/lib

          cp linux-7.0.3/arch/arm64/boot/Image artifacts/boot/Image-7.0.3-radxa-zero3w
          cp linux-7.0.3/arch/arm64/boot/dts/rockchip/${TARGET_DTB} artifacts/boot/dtb/rockchip/
          cp -r modules-staging/lib/modules artifacts/lib/

          cat > artifacts/install-radxa-zero3w.sh <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail

          echo "Installing kernel Image..."
          sudo cp boot/Image-7.0.3-radxa-zero3w /boot/

          echo "Installing Radxa Zero 3W DTB..."
          sudo mkdir -p /boot/dtb/rockchip
          sudo cp boot/dtb/rockchip/rk3566-radxa-zero-3w.dtb /boot/dtb/rockchip/

          echo "Installing modules..."
          sudo cp -a lib/modules/* /lib/modules/

          echo "Done."
          echo "Now adapt /boot/armbianEnv.txt or your bootloader to use:"
          echo "  Image-7.0.3-radxa-zero3w"
          echo "  dtb/rockchip/rk3566-radxa-zero-3w.dtb"
          EOF

          chmod +x artifacts/install-radxa-zero3w.sh

          tar -C artifacts -czf radxa-zero3w-kernel-7.0.3-arm64.tar.gz .

          ls -lh radxa-zero3w-kernel-7.0.3-arm64.tar.gz

      - name: Show ccache stats
        if: always()
        run: |
          ccache --show-stats || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: radxa-zero3w-kernel-7.0.3-arm64
          path: radxa-zero3w-kernel-7.0.3-arm64.tar.gz
          retention-days: 7

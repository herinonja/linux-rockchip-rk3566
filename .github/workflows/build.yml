name: Build Rockchip Kernel ARM64

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build.yml"

jobs:
  build:
    runs-on: ubuntu-24.04

    env:
      ARCH: arm64
      CROSS_COMPILE: aarch64-linux-gnu-
      CCACHE_DIR: ${{ github.workspace }}/.ccache

    steps:
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            bc bison flex build-essential \
            libssl-dev libelf-dev libncurses-dev \
            dwarves pahole ccache \
            git wget xz-utils \
            crossbuild-essential-arm64 \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-${{ github.sha }}
          restore-keys: |
            ccache-

      - name: Download kernel
        run: |
          wget https://cdn.kernel.org/pub/linux/kernel/v7.x/linux-7.0.3.tar.xz
          tar -xf linux-7.0.3.tar.xz

      - name: Clone patch repo
        run: |
          git clone https://github.com/inindev/linux-rockchip.git

      - name: Apply patches
        run: |
          cd linux-7.0.3
          for p in ../linux-rockchip/patches/*.patch; do
            patch -p1 < "$p"
          done

      - name: Configure kernel
        run: |
          cd linux-7.0.3
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- defconfig

          scripts/config --enable DRM
          scripts/config --enable DRM_ROCKCHIP
          scripts/config --module DRM_PANFROST
          scripts/config --module DRM_PANTHOR

          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- olddefconfig

      - name: Build kernel (no Debian packaging)
        run: |
          cd linux-7.0.3
          make -j$(nproc) \
            ARCH=arm64 \
            CROSS_COMPILE="ccache aarch64-linux-gnu-" \
            Image modules dtbs

      - name: Install modules to staging
        run: |
          cd linux-7.0.3
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
            INSTALL_MOD_PATH=../modules modules_install

      - name: Pack artifacts
        run: |
          mkdir artifacts
          cp linux-7.0.3/arch/arm64/boot/Image artifacts/
          cp -r linux-7.0.3/arch/arm64/boot/dts artifacts/
          cp -r modules/lib artifacts/modules

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernel-arm64
          path: artifacts/

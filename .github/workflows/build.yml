name: Build Radxa Zero 3W RK3566 Kernel DEB

on:
  workflow_dispatch:

  push:
    paths:
      - ".github/workflows/build.yml"

jobs:
  build:
    runs-on: ubuntu-24.04

    env:
      ARCH: arm64
      CROSS_COMPILE: aarch64-linux-gnu-
      KERNEL_VERSION: "7.0.3"
      TARGET_DTB: "rk3566-radxa-zero3.dtb"
      PACKAGE_NAME: "linux-image-radxa-zero3w-rk3566"
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 5G

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            git wget ca-certificates xz-utils patch rsync \
            bc bison flex build-essential \
            libssl-dev libelf-dev libncurses-dev \
            dwarves pahole ccache python3 \
            cpio lz4 zstd kmod fakeroot dpkg-dev \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            crossbuild-essential-arm64

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-rk3566-${{ runner.os }}-${{ github.ref_name }}
          restore-keys: |
            ccache-rk3566-${{ runner.os }}-

      - name: Prepare ccache
        run: |
          ccache --set-config=max_size=5G
          ccache --zero-stats

      - name: Clone linux-rockchip patches
        run: |
          git clone --branch v7.0.3 --depth 1 \
            https://github.com/inindev/linux-rockchip.git linux-rockchip

      - name: Download Linux source
        run: |
          wget https://cdn.kernel.org/pub/linux/kernel/v7.x/linux-7.0.3.tar.xz
          tar -xf linux-7.0.3.tar.xz

      - name: Apply patches
        run: |
          cd linux-7.0.3

          PATCH_DIR="../linux-rockchip/patches"

          if [ ! -d "$PATCH_DIR" ]; then
            echo "Patch directory not found: $PATCH_DIR"
            exit 1
          fi

          PATCHES=$(find "$PATCH_DIR" -type f \( -name "*.patch" -o -name "*.diff" \) | sort)

          if [ -z "$PATCHES" ]; then
            echo "No patch files found in $PATCH_DIR"
            exit 1
          fi

          for p in $PATCHES; do
            echo "Applying patch: $p"
            patch -p1 < "$p"
          done

      - name: Configure kernel for RK3566
        run: |
          cd linux-7.0.3

          make ARCH=arm64 CROSS_COMPILE=${CROSS_COMPILE} defconfig

          # Core platform
          scripts/config --enable ARM64
          scripts/config --enable ARCH_ROCKCHIP
          scripts/config --enable OF
          scripts/config --enable OF_OVERLAY

          # Initramfs support
          scripts/config --enable BLK_DEV_INITRD
          scripts/config --enable RD_GZIP
          scripts/config --enable RD_XZ
          scripts/config --enable RD_LZ4
          scripts/config --enable RD_ZSTD

          # Filesystems
          scripts/config --enable EXT4_FS
          scripts/config --enable BTRFS_FS
          scripts/config --enable VFAT_FS
          scripts/config --enable EXFAT_FS
          scripts/config --enable TMPFS
          scripts/config --enable DEVTMPFS
          scripts/config --enable DEVTMPFS_MOUNT

          # Rockchip storage / MMC / SD / eMMC
          scripts/config --enable MMC
          scripts/config --enable MMC_BLOCK
          scripts/config --enable MMC_DW
          scripts/config --enable MMC_DW_ROCKCHIP
          scripts/config --enable MMC_SDHCI
          scripts/config --enable MMC_SDHCI_OF_ARASAN
          scripts/config --enable PHY_ROCKCHIP_EMMC

          # USB for RK3566
          scripts/config --enable USB
          scripts/config --enable USB_XHCI_HCD
          scripts/config --enable USB_DWC3
          scripts/config --enable USB_DWC3_OF_SIMPLE
          scripts/config --enable PHY_ROCKCHIP_INNO_USB2
          scripts/config --enable PHY_ROCKCHIP_TYPEC
          scripts/config --enable PHY_ROCKCHIP_NANENG_COMBO_PHY

          # Networking basics
          scripts/config --enable NET
          scripts/config --enable INET
          scripts/config --enable ETHERNET
          scripts/config --enable STMMAC_ETH
          scripts/config --enable DWMAC_ROCKCHIP
          scripts/config --enable PHYLIB

          # Wi-Fi / Bluetooth stack as modules
          scripts/config --module CFG80211
          scripts/config --module MAC80211
          scripts/config --module RFKILL
          scripts/config --module BT
          scripts/config --module BT_HCIUART
          scripts/config --module BT_HCIUART_H4
          scripts/config --module BT_HCIUART_3WIRE
          scripts/config --module BT_HCIBTUSB

          # DRM / GPU / Display
          scripts/config --enable DRM
          scripts/config --enable DRM_KMS_HELPER
          scripts/config --enable DRM_GEM_SHMEM_HELPER
          scripts/config --enable DRM_SCHED
          scripts/config --enable DRM_ROCKCHIP
          scripts/config --enable ROCKCHIP_DW_HDMI
          scripts/config --enable PHY_ROCKCHIP_INNO_HDMI
          scripts/config --module DRM_PANFROST
          scripts/config --module DRM_PANTHOR

          # Media / VPU
          scripts/config --enable MEDIA_SUPPORT
          scripts/config --module VIDEO_HANTRO
          scripts/config --module VIDEO_ROCKCHIP_VDEC
          scripts/config --module VIDEO_ROCKCHIP_RGA

          # Audio
          scripts/config --enable SND
          scripts/config --enable SND_SOC
          scripts/config --enable SND_SOC_ROCKCHIP
          scripts/config --enable SND_SIMPLE_CARD
          scripts/config --enable SND_AUDIO_GRAPH_CARD

          # Disable non-RK3566 firmware-demanding drivers
          scripts/config --disable MSCC_PHY
          scripts/config --disable USB_XHCI_RCAR
          scripts/config --disable USB_XHCI_TEGRA

          make ARCH=arm64 CROSS_COMPILE=${CROSS_COMPILE} olddefconfig

      - name: Build kernel Image modules dtbs
        run: |
          cd linux-7.0.3

          make -j"$(nproc)" \
            ARCH=arm64 \
            CROSS_COMPILE="ccache aarch64-linux-gnu-" \
            Image modules dtbs

      - name: Get kernel release
        run: |
          cd linux-7.0.3
          KREL=$(make ARCH=arm64 CROSS_COMPILE=${CROSS_COMPILE} kernelrelease)
          echo "KERNEL_RELEASE=$KREL" >> "$GITHUB_ENV"
          echo "Kernel release: $KREL"

      - name: Verify required outputs
        run: |
          test -f "linux-7.0.3/arch/arm64/boot/Image"
          test -f "linux-7.0.3/.config"

          DTB_PATH="linux-7.0.3/arch/arm64/boot/dts/rockchip/${TARGET_DTB}"

          if [ ! -f "$DTB_PATH" ]; then
            echo "Missing DTB: $DTB_PATH"
            echo "Available RK3566 DTBs:"
            find linux-7.0.3/arch/arm64/boot/dts/rockchip -name "rk3566*.dtb" | sort
            exit 1
          fi

          echo "Kernel Image OK"
          echo "Kernel config OK"
          echo "Target DTB OK: $DTB_PATH"

      - name: Install modules to package root
        run: |
          rm -rf pkgroot
          mkdir -p pkgroot

          cd linux-7.0.3

          make ARCH=arm64 \
            CROSS_COMPILE=${CROSS_COMPILE} \
            INSTALL_MOD_PATH="${{ github.workspace }}/pkgroot" \
            modules_install

      - name: Create minimal Debian package
        run: |
          set -euo pipefail

          PKGDIR="deb-pkg"
          ROOT="${PKGDIR}/root"
          DEBIAN="${ROOT}/DEBIAN"

          rm -rf "${PKGDIR}" artifacts
          mkdir -p "${DEBIAN}"
          mkdir -p "${ROOT}/boot/dtb/rockchip"
          mkdir -p "${ROOT}/usr/share/doc/${PACKAGE_NAME}"
          mkdir -p "${ROOT}/lib"

          IMAGE_NAME="Image-${KERNEL_RELEASE}-radxa-zero3w"

          cp "linux-7.0.3/arch/arm64/boot/Image" \
            "${ROOT}/boot/${IMAGE_NAME}"

          cp "linux-7.0.3/.config" \
            "${ROOT}/boot/config-${KERNEL_RELEASE}"

          cp "linux-7.0.3/arch/arm64/boot/dts/rockchip/${TARGET_DTB}" \
            "${ROOT}/boot/dtb/rockchip/${TARGET_DTB}"

          cp -a "pkgroot/lib/modules" "${ROOT}/lib/modules"

          find "${ROOT}/lib/modules/${KERNEL_RELEASE}" -name build -type l -delete || true
          find "${ROOT}/lib/modules/${KERNEL_RELEASE}" -name source -type l -delete || true

          cat > "${DEBIAN}/control" <<EOF
          Package: ${PACKAGE_NAME}
          Version: ${KERNEL_RELEASE}-1
          Section: kernel
          Priority: optional
          Architecture: arm64
          Maintainer: herinonja
          Description: Minimal Linux kernel package for Radxa Zero 3W RK3566
           Contains only the kernel Image, kernel config, Radxa Zero 3 RK3566 DTB,
           and matching kernel modules.
           This package does not modify /boot/armbianEnv.txt.
          EOF

          cat > "${DEBIAN}/postinst" <<'EOF'
          #!/bin/sh
          set -e

          KERNEL_RELEASE="__KERNEL_RELEASE__"
          IMAGE_NAME="Image-${KERNEL_RELEASE}-radxa-zero3w"
          DTB_NAME="rk3566-radxa-zero3.dtb"

          echo "Installed kernel files:"
          echo "  /boot/${IMAGE_NAME}"
          echo "  /boot/config-${KERNEL_RELEASE}"
          echo "  /boot/dtb/rockchip/${DTB_NAME}"
          echo "  /lib/modules/${KERNEL_RELEASE}"

          echo "Running depmod for ${KERNEL_RELEASE}..."
          depmod "${KERNEL_RELEASE}" || true

          if command -v update-initramfs >/dev/null 2>&1; then
            echo "Generating initramfs for ${KERNEL_RELEASE}..."
            update-initramfs -c -k "${KERNEL_RELEASE}" || true
          fi

          echo
          echo "IMPORTANT:"
          echo "This package did NOT modify /boot/armbianEnv.txt."
          echo
          echo "Your current working Armbian setup likely uses:"
          echo "  /boot/Image -> vmlinuz-*"
          echo "  /boot/uInitrd -> uInitrd-*"
          echo "  fdtfile=rockchip/${DTB_NAME}"
          echo
          echo "To test this kernel manually, backup current symlinks first:"
          echo "  sudo cp -a /boot/Image /boot/Image.backup-working"
          echo "  sudo cp -a /boot/uInitrd /boot/uInitrd.backup-working"
          echo
          echo "Then switch symlinks:"
          echo "  sudo ln -sf ${IMAGE_NAME} /boot/Image"
          echo "  sudo ln -sf uInitrd-${KERNEL_RELEASE} /boot/uInitrd"
          echo
          echo "Do not change /boot/armbianEnv.txt unless necessary."

          exit 0
          EOF

          sed -i "s|__KERNEL_RELEASE__|${KERNEL_RELEASE}|g" "${DEBIAN}/postinst"
          chmod 755 "${DEBIAN}/postinst"

          cat > "${DEBIAN}/postrm" <<'EOF'
          #!/bin/sh
          set -e

          KERNEL_RELEASE="__KERNEL_RELEASE__"

          if [ "$1" = "remove" ] || [ "$1" = "purge" ]; then
            if command -v update-initramfs >/dev/null 2>&1; then
              update-initramfs -d -k "${KERNEL_RELEASE}" || true
            fi
          fi

          exit 0
          EOF

          sed -i "s|__KERNEL_RELEASE__|${KERNEL_RELEASE}|g" "${DEBIAN}/postrm"
          chmod 755 "${DEBIAN}/postrm"

          cat > "${ROOT}/usr/share/doc/${PACKAGE_NAME}/armbianEnv.example" <<EOF
          # Example only. Do NOT copy blindly.
          #
          # Current known-good setup:
          #   fdtfile=rockchip/rk3566-radxa-zero3.dtb
          #
          # This package intentionally does NOT modify /boot/armbianEnv.txt.
          #
          # Manual test method:
          #   sudo cp -a /boot/Image /boot/Image.backup-working
          #   sudo cp -a /boot/uInitrd /boot/uInitrd.backup-working
          #   sudo ln -sf Image-${KERNEL_RELEASE}-radxa-zero3w /boot/Image
          #   sudo ln -sf uInitrd-${KERNEL_RELEASE} /boot/uInitrd
          #   sudo reboot
          #
          # Recovery from SD:
          #   sudo ln -sf vmlinuz-6.1.115-vendor-rk35xx /mnt/emmc/boot/Image
          #   sudo ln -sf uInitrd-6.1.115-vendor-rk35xx /mnt/emmc/boot/uInitrd
          EOF

          dpkg-deb --build "${ROOT}" "${PACKAGE_NAME}_${KERNEL_RELEASE}-1_arm64.deb"

          mkdir -p artifacts
          mv "${PACKAGE_NAME}_${KERNEL_RELEASE}-1_arm64.deb" artifacts/
          cd artifacts
          sha256sum *.deb > SHA256SUMS

          echo "Generated artifacts:"
          ls -lh

      - name: Show package contents
        run: |
          dpkg-deb -c artifacts/*.deb | head -180

      - name: Show ccache stats
        if: always()
        run: |
          ccache --show-stats || true

      - name: Upload DEB artifact
        uses: actions/upload-artifact@v4
        with:
          name: radxa-zero3w-rk3566-kernel-deb
          path: artifacts/
          retention-days: 7

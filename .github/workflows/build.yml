name: Build Radxa Zero 3W RK3566 Kernel

on:
  workflow_dispatch:

  push:
    paths:
      - ".github/workflows/build.yml"

jobs:
  build:
    runs-on: ubuntu-24.04

    env:
      ARCH: arm64
      CROSS_COMPILE: aarch64-linux-gnu-
      TARGET_DTB: rk3566-radxa-zero-3w.dtb
      IMAGE_PACKAGE: linux-image-radxa-zero3w-rk3566
      HEADERS_PACKAGE: linux-headers-radxa-zero3w-rk3566
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 5G

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo dpkg --add-architecture arm64

          sudo cp /etc/apt/sources.list.d/ubuntu.sources /tmp/ubuntu.sources.backup

          sudo awk '
            /^Types:/ { print; next }
            /^URIs:/ { print; next }
            /^Suites:/ { print; next }
            /^Components:/ { print; next }
            /^Signed-By:/ { print; print "Architectures: amd64"; next }
            { print }
          ' /tmp/ubuntu.sources.backup | sudo tee /etc/apt/sources.list.d/ubuntu.sources >/dev/null

          cat <<'EOF' | sudo tee /etc/apt/sources.list.d/ubuntu-arm64-ports.sources >/dev/null
          Types: deb
          URIs: http://ports.ubuntu.com/ubuntu-ports
          Suites: noble noble-updates noble-backports noble-security
          Components: main restricted universe multiverse
          Architectures: arm64
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
          EOF

          sudo apt update

          sudo apt install -y \
            git wget curl ca-certificates xz-utils patch rsync \
            bc bison flex build-essential \
            libssl-dev libelf-dev libncurses-dev \
            dwarves pahole ccache python3 \
            cpio lz4 zstd kmod fakeroot dpkg-dev \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            crossbuild-essential-arm64 \
            devscripts debhelper dh-make lintian \
            dkms dh-dkms dos2unix dh-exec \
            libc6:arm64 libgcc-s1:arm64

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-rk3566-${{ runner.os }}-${{ github.ref_name }}
          restore-keys: |
            ccache-rk3566-${{ runner.os }}-

      - name: Prepare ccache
        run: |
          ccache --set-config=max_size=5G
          ccache --zero-stats

      - name: Clone linux-rockchip patches
        run: |
          git clone --branch v7.0.3 --depth 1 \
            https://github.com/inindev/linux-rockchip.git linux-rockchip

      - name: Download Linux source
        run: |
          wget https://cdn.kernel.org/pub/linux/kernel/v7.x/linux-7.0.3.tar.xz
          tar -xf linux-7.0.3.tar.xz

      - name: Apply patches
        run: |
          cd linux-7.0.3

          PATCH_DIR="../linux-rockchip/patches"

          if [ ! -d "${PATCH_DIR}" ]; then
            echo "Patch directory not found: ${PATCH_DIR}"
            exit 1
          fi

          find "${PATCH_DIR}" -type f \( -name "*.patch" -o -name "*.diff" \) | sort | while read -r patch_file; do
            echo "Applying ${patch_file}"
            patch -p1 < "${patch_file}"
          done

      - name: Configure kernel
        run: |
          cd linux-7.0.3

          make ARCH=arm64 CROSS_COMPILE="${CROSS_COMPILE}" defconfig

          scripts/config --enable ARM64
          scripts/config --enable ARCH_ROCKCHIP
          scripts/config --enable OF
          scripts/config --enable OF_OVERLAY

          scripts/config --enable BLK_DEV_INITRD
          scripts/config --enable RD_GZIP
          scripts/config --enable RD_XZ
          scripts/config --enable RD_LZ4
          scripts/config --enable RD_ZSTD

          scripts/config --enable EXT4_FS
          scripts/config --enable BTRFS_FS
          scripts/config --enable VFAT_FS
          scripts/config --enable EXFAT_FS
          scripts/config --enable TMPFS
          scripts/config --enable DEVTMPFS
          scripts/config --enable DEVTMPFS_MOUNT

          scripts/config --enable MMC
          scripts/config --enable MMC_BLOCK
          scripts/config --enable MMC_DW
          scripts/config --enable MMC_DW_ROCKCHIP
          scripts/config --enable MMC_SDHCI
          scripts/config --enable MMC_SDHCI_PLTFM
          scripts/config --enable MMC_SDHCI_OF_ARASAN
          scripts/config --enable PHY_ROCKCHIP_EMMC

          scripts/config --enable USB
          scripts/config --enable USB_XHCI_HCD
          scripts/config --enable USB_DWC3
          scripts/config --enable USB_DWC3_OF_SIMPLE
          scripts/config --enable USB_GADGET
          scripts/config --enable USB_CONFIGFS
          scripts/config --enable USB_CONFIGFS_ECM
          scripts/config --enable USB_CONFIGFS_RNDIS
          scripts/config --enable PHY_ROCKCHIP_INNO_USB2
          scripts/config --enable PHY_ROCKCHIP_TYPEC
          scripts/config --enable PHY_ROCKCHIP_NANENG_COMBO_PHY

          scripts/config --enable NET
          scripts/config --enable INET
          scripts/config --enable ETHERNET
          scripts/config --enable STMMAC_ETH
          scripts/config --enable DWMAC_ROCKCHIP
          scripts/config --enable PHYLIB

          scripts/config --module CFG80211
          scripts/config --module MAC80211
          scripts/config --module RFKILL
          scripts/config --module BT
          scripts/config --module BT_HCIUART
          scripts/config --module BT_HCIBTUSB

          scripts/config --enable DRM
          scripts/config --enable DRM_ROCKCHIP
          scripts/config --enable DRM_KMS_HELPER
          scripts/config --enable DRM_GEM_SHMEM_HELPER
          scripts/config --enable DRM_SCHED
          scripts/config --module DRM_PANFROST
          scripts/config --module DRM_PANTHOR

          scripts/config --module NF_CONNTRACK
          scripts/config --module NF_NAT
          scripts/config --module IP_NF_IPTABLES
          scripts/config --module IP_NF_FILTER
          scripts/config --module IP_NF_NAT
          scripts/config --module NFT_CT
          scripts/config --module NFT_NAT
          scripts/config --module BRIDGE
          scripts/config --module BRIDGE_NETFILTER

          scripts/config --enable MEDIA_SUPPORT
          scripts/config --module VIDEO_HANTRO
          scripts/config --module VIDEO_ROCKCHIP_VDEC
          scripts/config --module VIDEO_ROCKCHIP_RGA

          scripts/config --enable SND
          scripts/config --enable SND_SOC
          scripts/config --enable SND_SOC_ROCKCHIP
          scripts/config --enable SND_SIMPLE_CARD
          scripts/config --enable SND_AUDIO_GRAPH_CARD
          scripts/config --module SND_USB_AUDIO

          scripts/config --disable MSCC_PHY
          scripts/config --disable USB_XHCI_RCAR
          scripts/config --disable USB_XHCI_TEGRA

          make ARCH=arm64 CROSS_COMPILE="${CROSS_COMPILE}" olddefconfig

      - name: Build kernel, modules and target DTB only
        run: |
          cd linux-7.0.3

          make -j"$(nproc)" \
            ARCH=arm64 \
            CROSS_COMPILE="ccache aarch64-linux-gnu-" \
            Image modules rockchip/${TARGET_DTB}

      - name: Get kernel release
        run: |
          cd linux-7.0.3
          KREL="$(make ARCH=arm64 CROSS_COMPILE="${CROSS_COMPILE}" kernelrelease)"
          echo "KERNEL_RELEASE=${KREL}" >> "${GITHUB_ENV}"
          echo "Kernel release: ${KREL}"

      - name: Verify kernel outputs
        run: |
          test -f "linux-7.0.3/arch/arm64/boot/Image"
          test -f "linux-7.0.3/.config"
          test -f "linux-7.0.3/arch/arm64/boot/dts/rockchip/${TARGET_DTB}"

      - name: Install modules to staging
        run: |
          rm -rf modules-staging
          mkdir -p modules-staging

          cd linux-7.0.3

          make ARCH=arm64 \
            CROSS_COMPILE="${CROSS_COMPILE}" \
            INSTALL_MOD_PATH="${{ github.workspace }}/modules-staging" \
            modules_install

      - name: Prepare headers staging
        run: |
          set -euo pipefail

          rm -rf headers-staging
          mkdir -p "headers-staging/usr/src/linux-headers-${KERNEL_RELEASE}"

          rsync -a \
            --exclude='.git' \
            --exclude='*.o' \
            --exclude='*.ko' \
            --exclude='*.cmd' \
            --exclude='*.mod' \
            --exclude='*.mod.c' \
            linux-7.0.3/ "headers-staging/usr/src/linux-headers-${KERNEL_RELEASE}/"

          cp linux-7.0.3/.config \
            "headers-staging/usr/src/linux-headers-${KERNEL_RELEASE}/.config"

          cp linux-7.0.3/Module.symvers \
            "headers-staging/usr/src/linux-headers-${KERNEL_RELEASE}/Module.symvers"

          cp linux-7.0.3/modules.order \
            "headers-staging/usr/src/linux-headers-${KERNEL_RELEASE}/modules.order"

      - name: Build headers DEB
        run: |
          set -euo pipefail

          rm -rf headers-pkg artifacts
          mkdir -p artifacts
          mkdir -p headers-pkg/DEBIAN
          mkdir -p headers-pkg/usr/src
          mkdir -p "headers-pkg/usr/share/doc/${HEADERS_PACKAGE}"

          cp -a "headers-staging/usr/src/linux-headers-${KERNEL_RELEASE}" \
            headers-pkg/usr/src/

          cat <<'EOF' > headers-pkg/DEBIAN/control
          Package: __HEADERS_PACKAGE__
          Version: __KERNEL_RELEASE__-1
          Section: kernel
          Priority: optional
          Architecture: arm64
          Maintainer: herinonja
          Depends: build-essential, bc, bison, flex, libssl-dev, libelf-dev
          Description: Kernel headers for Radxa Zero 3W RK3566
           Provides headers for external modules and DKMS.
          EOF

          sed -i "s|__HEADERS_PACKAGE__|${HEADERS_PACKAGE}|g" headers-pkg/DEBIAN/control
          sed -i "s|__KERNEL_RELEASE__|${KERNEL_RELEASE}|g" headers-pkg/DEBIAN/control

          cat <<'EOF' > "headers-pkg/usr/share/doc/${HEADERS_PACKAGE}/README.headers"
          Kernel headers for external modules and DKMS.
          EOF

          dpkg-deb --build headers-pkg \
            "artifacts/${HEADERS_PACKAGE}_${KERNEL_RELEASE}-1_arm64.deb"

      - name: Build kernel image DEB
        run: |
          set -euo pipefail

          rm -rf image-pkg
          mkdir -p image-pkg/DEBIAN
          mkdir -p image-pkg/boot/dtb/rockchip
          mkdir -p image-pkg/lib
          mkdir -p "image-pkg/usr/share/doc/${IMAGE_PACKAGE}"

          IMAGE_NAME="Image-${KERNEL_RELEASE}-radxa-zero3w"

          cp linux-7.0.3/arch/arm64/boot/Image \
            "image-pkg/boot/${IMAGE_NAME}"

          cp linux-7.0.3/.config \
            "image-pkg/boot/config-${KERNEL_RELEASE}"

          cp "linux-7.0.3/arch/arm64/boot/dts/rockchip/${TARGET_DTB}" \
            "image-pkg/boot/dtb/rockchip/${TARGET_DTB}"

          cp -a modules-staging/lib/modules image-pkg/lib/

          mkdir -p "image-pkg/lib/modules/${KERNEL_RELEASE}"

          rm -f "image-pkg/lib/modules/${KERNEL_RELEASE}/build"
          rm -f "image-pkg/lib/modules/${KERNEL_RELEASE}/source"

          ln -s "/usr/src/linux-headers-${KERNEL_RELEASE}" \
            "image-pkg/lib/modules/${KERNEL_RELEASE}/build"

          ln -s "/usr/src/linux-headers-${KERNEL_RELEASE}" \
            "image-pkg/lib/modules/${KERNEL_RELEASE}/source"

          cat <<'EOF' > image-pkg/DEBIAN/control
          Package: __IMAGE_PACKAGE__
          Version: __KERNEL_RELEASE__-1
          Section: kernel
          Priority: optional
          Architecture: arm64
          Maintainer: herinonja
          Depends: initramfs-tools
          Recommends: __HEADERS_PACKAGE__ (= __KERNEL_RELEASE__-1), aic8800-firmware, aic8800-sdio-dkms
          Description: Linux kernel image for Radxa Zero 3W RK3566
           Contains kernel Image, config, Radxa Zero 3W mainline DTB,
           matching modules, and automatic boot activation.
          EOF

          sed -i "s|__IMAGE_PACKAGE__|${IMAGE_PACKAGE}|g" image-pkg/DEBIAN/control
          sed -i "s|__HEADERS_PACKAGE__|${HEADERS_PACKAGE}|g" image-pkg/DEBIAN/control
          sed -i "s|__KERNEL_RELEASE__|${KERNEL_RELEASE}|g" image-pkg/DEBIAN/control

          cat <<'EOF' > image-pkg/DEBIAN/postinst
          #!/bin/sh
          set -e

          KERNEL_RELEASE="__KERNEL_RELEASE__"
          IMAGE_NAME="Image-${KERNEL_RELEASE}-radxa-zero3w"
          DTB_NAME="__TARGET_DTB__"
          BACKUP_TAG="before-rk3566-${KERNEL_RELEASE}"

          echo "Installed kernel files:"
          echo "  /boot/${IMAGE_NAME}"
          echo "  /boot/config-${KERNEL_RELEASE}"
          echo "  /boot/dtb/rockchip/${DTB_NAME}"
          echo "  /lib/modules/${KERNEL_RELEASE}"

          depmod "${KERNEL_RELEASE}" || true

          if command -v update-initramfs >/dev/null 2>&1; then
            update-initramfs -c -k "${KERNEL_RELEASE}" || true
          fi

          echo "Creating boot backups..."
          [ -e /boot/Image ] && cp -a /boot/Image "/boot/Image.backup-${BACKUP_TAG}" || true
          [ -e /boot/uInitrd ] && cp -a /boot/uInitrd "/boot/uInitrd.backup-${BACKUP_TAG}" || true
          [ -f /boot/armbianEnv.txt ] && cp -a /boot/armbianEnv.txt "/boot/armbianEnv.txt.backup-${BACKUP_TAG}" || true

          echo "Activating new kernel automatically..."
          ln -sf "${IMAGE_NAME}" /boot/Image
          ln -sf "uInitrd-${KERNEL_RELEASE}" /boot/uInitrd

          if [ -f /boot/armbianEnv.txt ]; then
            if grep -q '^fdtfile=' /boot/armbianEnv.txt; then
              sed -i "s|^fdtfile=.*|fdtfile=rockchip/${DTB_NAME}|" /boot/armbianEnv.txt
            else
              echo "fdtfile=rockchip/${DTB_NAME}" >> /boot/armbianEnv.txt
            fi
          fi

          echo "Kernel activated."

          exit 0
          EOF

          sed -i "s|__KERNEL_RELEASE__|${KERNEL_RELEASE}|g" image-pkg/DEBIAN/postinst
          sed -i "s|__TARGET_DTB__|${TARGET_DTB}|g" image-pkg/DEBIAN/postinst
          chmod 755 image-pkg/DEBIAN/postinst

          cat <<'EOF' > image-pkg/DEBIAN/postrm
          #!/bin/sh
          set -e

          KERNEL_RELEASE="__KERNEL_RELEASE__"

          if [ "$1" = "remove" ] || [ "$1" = "purge" ]; then
            if command -v update-initramfs >/dev/null 2>&1; then
              update-initramfs -d -k "${KERNEL_RELEASE}" || true
            fi
          fi

          exit 0
          EOF

          sed -i "s|__KERNEL_RELEASE__|${KERNEL_RELEASE}|g" image-pkg/DEBIAN/postrm
          chmod 755 image-pkg/DEBIAN/postrm

          cat <<'EOF' > "image-pkg/usr/share/doc/${IMAGE_PACKAGE}/README.radxa-zero3w"
          This package automatically activates the custom kernel.

          It changes:
            /boot/Image
            /boot/uInitrd
            fdtfile in /boot/armbianEnv.txt

          Backup files are created before modification.
          EOF

          dpkg-deb --build image-pkg \
            "artifacts/${IMAGE_PACKAGE}_${KERNEL_RELEASE}-1_arm64.deb"

      - name: Build AIC8800 packages
        run: |
          set -euo pipefail

          git clone --recurse-submodules https://github.com/radxa-pkg/aic8800.git radxa-aic8800
          cd radxa-aic8800

          make deb

          cd ..

          echo "Generated AIC8800 debs:"
          ls -lh aic8800*.deb aicrf-test*.deb 2>/dev/null || true

          cp -v aic8800-sdio-dkms_*.deb artifacts/
          cp -v aic8800-firmware_*.deb artifacts/
          cp -v aicrf-test_*.deb artifacts/ || true

      - name: Verify artifacts
        run: |
          cd artifacts

          echo "Final artifacts:"
          ls -lh

          test -f linux-image-radxa-zero3w-rk3566_*.deb
          test -f linux-headers-radxa-zero3w-rk3566_*.deb
          test -f aic8800-sdio-dkms_*.deb
          test -f aic8800-firmware_*.deb

          sha256sum *.deb > SHA256SUMS

      - name: Show ccache stats
        if: always()
        run: |
          ccache --show-stats || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: radxa-zero3w-rk3566-kernel-deb
          path: artifacts/
          retention-days: 7
